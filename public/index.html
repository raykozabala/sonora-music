<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#FF4757">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sonora Music">
  <meta name="description" content="Sonora Music v4 Ultimate — Tu reproductor de música profesional">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <title>Sonora Music</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/themes.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/player.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/responsive.css">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <style>
    /* Critical inline styles for instant splash */
    #splash-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      background: linear-gradient(135deg, #FF3E2E 0%, #FF4757 40%, #FF6B35 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-note {
      width: 80px; height: 80px;
      animation: splashPulse 1.5s ease-in-out infinite;
    }
    .splash-title {
      color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px; font-weight: 700; margin-top: 20px; letter-spacing: -0.5px;
    }
    .splash-subtitle {
      color: rgba(255,255,255,0.8); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; margin-top: 8px;
    }
    .splash-loader {
      width: 40px; height: 40px; margin-top: 32px;
      border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: splashSpin 0.8s linear infinite;
    }
    @keyframes splashPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }
    @keyframes splashSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="theme-coral dark font-medium">

  <!-- ═══════════════ SPLASH SCREEN ═══════════════ -->
  <div id="splash-screen">
    <img class="splash-note" src="./icons/icon-192.png" style="border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.4);" alt="Logo">
    <div class="splash-title">Sonora Music</div>
    <div class="splash-subtitle">v7.6.3</div>
    <div class="splash-loader"></div>
  </div>

  <!-- ═══════════════ MAIN APP ═══════════════ -->
  <div id="app" class="app-hidden">

    <!-- ── Header ── -->
    <header id="app-header">
      <div class="header-left">
        <button id="header-back" class="btn--icon header-btn hidden" aria-label="Volver">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
      <h1 class="header-title" id="header-title">
        <svg class="header-logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="var(--color-primary)" opacity="0.2"/>
          <path d="M9 18c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm9-12v12c0 .6-.4 1-1 1s-1-.4-1-1V8l-7 2V7l9-3v2z" fill="var(--color-primary)"/>
        </svg>
        Sonora Music
      </h1>
      <div class="header-actions">
        <button id="header-downloads-btn" class="btn--icon header-btn downloads-btn" aria-label="Gestor de Descargas" title="Gestor de Descargas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="downloads-badge hidden" id="downloads-badge">0</span>
        </button>
        <button id="header-server-status" class="btn--icon header-btn server-status-btn" aria-label="Estado del servidor" title="Estado del servidor">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span class="server-dot" id="server-dot"></span>
        </button>
        <button id="header-profile-btn" class="btn--icon header-btn" aria-label="Perfil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Main Content Area ── -->
    <main id="main-content">
      <!-- Pages render here dynamically -->
      <div class="page-loading">
        <div class="loading-spinner"></div>
      </div>
    </main>

    <!-- ═══════════════ MINI PLAYER ═══════════════ -->
    <div id="mini-player" class="hidden">
      <div class="mini-player__progress">
        <div class="mini-player__progress-fill" id="mini-progress-fill"></div>
      </div>
      <div class="mini-player__content" id="mini-player-content">
        <div class="mini-player__artwork">
          <img id="mini-artwork" src="" alt="" loading="lazy">
        </div>
        <div class="mini-player__info">
          <span class="mini-player__title" id="mini-title">—</span>
          <span class="mini-player__artist" id="mini-artist">—</span>
        </div>
        <div class="mini-player__controls">
          <button class="btn--icon" id="mini-play-btn" aria-label="Reproducir">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path id="mini-play-icon" d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button class="btn--icon" id="mini-next-btn" aria-label="Siguiente">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zm2 0V6l6.5 6L8 18zm8-12v12h2V6h-2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══════════════ FULL PLAYER OVERLAY ═══════════════ -->
    <div id="full-player" class="hidden">
      <div class="player__bg-blur" id="player-bg-blur"></div>

      <div class="player__header">
        <button id="player-close" class="btn--icon" aria-label="Cerrar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="player__header-info">
          <span class="player__source-label">Reproduciendo</span>
          <span class="player__source" id="player-source">Sonora Music</span>
        </div>
        <button id="player-menu" class="btn--icon" aria-label="Más opciones">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>

      <div class="player__artwork-container">
        <canvas id="visualizer-canvas"></canvas>
        <div class="player__artwork" id="player-artwork-wrapper">
          <img id="player-artwork-img" src="" alt="Artwork">
        </div>
      </div>

      <div class="player__info">
        <h2 id="player-title" class="player__title">—</h2>
        <p id="player-artist" class="player__artist">—</p>
      </div>

      <div class="player__progress">
        <span id="player-current-time" class="player__time">0:00</span>
        <div class="player__progress-bar" id="player-progress-bar">
          <div class="player__progress-fill" id="player-progress-fill"></div>
          <div class="player__progress-thumb" id="player-progress-thumb"></div>
        </div>
        <span id="player-duration" class="player__time">0:00</span>
      </div>

      <div class="player__controls">
        <button id="player-shuffle" class="btn--icon player-ctrl" aria-label="Aleatorio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
        <button id="player-prev" class="btn--icon btn--lg player-ctrl" aria-label="Anterior">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button id="player-play" class="btn--icon btn--play player-ctrl" aria-label="Reproducir">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path id="player-play-icon" d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button id="player-next" class="btn--icon btn--lg player-ctrl" aria-label="Siguiente">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zm2 0V6l6.5 6L8 18zm8-12v12h2V6h-2z"/>
          </svg>
        </button>
        <button id="player-repeat" class="btn--icon player-ctrl" aria-label="Repetir">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          <span class="repeat-badge hidden" id="repeat-badge">1</span>
        </button>
      </div>

      <div class="player__extras">
        <button id="player-lyrics" class="btn--icon" aria-label="Letra">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h12M4 14h16M4 18h8"/></svg>
        </button>
        <button id="player-visualizer-toggle" class="btn--icon" aria-label="Visualizador">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="10" width="3" height="10" rx="1.5"/>
            <rect x="7" y="6" width="3" height="14" rx="1.5"/>
            <rect x="12" y="3" width="3" height="17" rx="1.5"/>
            <rect x="17" y="8" width="3" height="12" rx="1.5"/>
          </svg>
        </button>
        <button id="player-sleep" class="btn--icon" aria-label="Temporizador">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button id="player-queue" class="btn--icon" aria-label="Cola">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button id="player-download" class="btn--icon" aria-label="Descargar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="player-lark" class="btn--icon" aria-label="Abrir en Lark Player" title="Abrir en Lark Player">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button id="player-share" class="btn--icon" aria-label="Compartir">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>

      <div class="player__volume">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
        <input type="range" id="player-volume" min="0" max="100" value="80" class="volume-slider" aria-label="Volumen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </div>
    </div>

    <!-- ═══════════════ BOTTOM NAVIGATION ═══════════════ -->
    <nav id="bottom-nav">
      <button data-page="home" class="nav-item active" aria-label="Inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button data-page="search" class="nav-item" aria-label="Buscar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Buscar</span>
      </button>
      <button data-page="library" class="nav-item" aria-label="Biblioteca">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>Biblioteca</span>
      </button>
      <button data-page="playlists" class="nav-item" aria-label="Listas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Listas</span>
      </button>
      <button data-page="discover" class="nav-item" aria-label="Descubrir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span>Descubrir</span>
      </button>
    </nav>

    <!-- ═══════════════ OVERLAYS & PANELS ═══════════════ -->

    <!-- Queue Panel -->
    <div id="queue-panel" class="panel hidden">
      <div class="panel__header">
        <h3>Cola de reproducción</h3>
        <button class="btn--icon" id="queue-close" aria-label="Cerrar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="panel__content" id="queue-list"></div>
    </div>

    <!-- Lyrics Panel -->
    <div id="lyrics-panel" class="panel hidden">
      <div class="lyrics__bg-blur" id="lyrics-bg-blur" aria-hidden="true"></div>
      <div class="lyrics__bg-tint" aria-hidden="true"></div>
      <div class="lyrics-panel__header">
        <div class="lyrics-panel__titles">
          <div class="lyrics-panel__title" id="lyrics-track-title">Letra</div>
          <div class="lyrics-panel__artist" id="lyrics-track-artist"></div>
        </div>
        <div class="lyrics-disc" id="lyrics-disc" aria-hidden="true">
          <img id="lyrics-disc-img" class="lyrics-disc__img" src="" alt="" />
          <span class="lyrics-disc__hole"></span>
        </div>
        <div class="lyrics-panel__actions">
          <button class="btn--icon" id="lyrics-menu-btn" aria-label="Opciones de letra" title="Opciones de letra">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
            </svg>
          </button>
          <button class="btn--icon" id="lyrics-close" aria-label="Cerrar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="panel__content lyrics-panel__content" id="lyrics-content">
        <p class="lyrics-placeholder">No hay letra disponible para esta canción</p>
      </div>
      <button id="lyrics-sync" class="lyrics-sync-btn hidden" aria-label="Volver a la letra que suena">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Sincronizar
      </button>
    </div>

    <!-- Sleep Timer Modal -->
    <div id="sleep-timer-modal" class="modal hidden">
      <div class="modal__backdrop"></div>
      <div class="modal__content">
        <h3>⏰ Temporizador de sueño</h3>
        <div class="modal__options" id="sleep-timer-options">
          <button class="modal__option" data-minutes="5">5 minutos</button>
          <button class="modal__option" data-minutes="10">10 minutos</button>
          <button class="modal__option" data-minutes="15">15 minutos</button>
          <button class="modal__option" data-minutes="30">30 minutos</button>
          <button class="modal__option" data-minutes="60">1 hora</button>
          <button class="modal__option" data-minutes="0">Cancelar timer</button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

  </div><!-- /app -->

  <!-- ═══════════════ SCRIPTS (load order matters) ═══════════════ -->
  <script src="./js/store.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/themes.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/visualizer.js"></script>
  <script src="./js/download.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/home.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/library.js"></script>
  <script src="./js/discover.js"></script>
  <script src="./js/playlists.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
